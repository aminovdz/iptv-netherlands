<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#13131a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4EC2"/>
      <stop offset="100%" stop-color="#E94560"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#7C4EC2" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#E94560" opacity="0.2" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="150" fill="#38BDF8" opacity="0.15" filter="url(#glow)"/>

  <!-- Glass Card Outer Frame -->
  <rect x="60" y="50" width="1080" height="530" rx="32" fill="rgba(19, 19, 26, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="110" y="100" width="310" height="40" rx="20" fill="rgba(233, 69, 96, 0.15)" stroke="rgba(233, 69, 96, 0.4)" stroke-width="1"/>
  <circle cx="130" cy="120" r="5" fill="#E94560"/>
  <text x="146" y="125" fill="#FF758F" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">#1 IPTV MET ABONNEMENT</text>

  <!-- Brand Logo & Name -->
  <rect x="110" y="165" width="60" height="60" rx="16" fill="url(#purpleGrad)"/>
  <path d="M130 180 L155 195 L130 210 Z" fill="#ffffff"/>
  <text x="185" y="210" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    IPTV <tspan fill="#E94560">Nederlandse</tspan>
  </text>

  <!-- Main Headline -->
  <text x="110" y="300" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    4K UHD Streaming Zonder Haperingen
  </text>
  <text x="110" y="360" fill="#d1b3ff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700">
    Direct Activeren • Anti-Freeze 99.9% Uptime
  </text>

  <!-- Feature Tags -->
  <rect x="70" y="420" width="220" height="42" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="90" y="446" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">✓ Veilige Betaling</text>

  <rect x="305" y="420" width="220" height="42" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="325" y="446" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">✓ 99.9% Server Uptime</text>

  <rect x="540" y="420" width="230" height="42" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="560" y="446" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">✓ Gratis IBO Player Bonus</text>

  <!-- Right Deal Callout Box -->
  <rect x="800" y="160" width="280" height="340" rx="24" fill="url(#purpleGrad)" opacity="0.15"/>
  <rect x="800" y="160" width="280" height="340" rx="24" stroke="url(#purpleGrad)" stroke-width="2"/>
  
  <text x="940" y="220" text-anchor="middle" fill="#FF758F" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="1">MEEST GEKOZEN DEAL</text>
  <text x="940" y="295" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900">€35</text>
  <text x="940" y="335" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">12 Maanden Toegang</text>
  <text x="940" y="375" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">+ IBO Player Activatie</text>
  
  <rect x="830" y="415" width="220" height="48" rx="12" fill="#E94560"/>
  <text x="940" y="445" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">DIRECT BESTELLEN</text>

  <!-- Bottom URL -->
  <text x="110" y="525" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">iptvnederlandse.store</text>
</svg>
